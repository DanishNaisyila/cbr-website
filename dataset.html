<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dataset Kasus - Sistem Pakar CBR</title>
<meta name="description" content="Dataset kasus lama penyakit jantung dan lambung beserta gejala dan bobotnya.">
<meta name="theme-color" content="#0d5c61">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='10' fill='%230d5c61'/%3E%3Cpath d='M5 19h6l3-7 5 14 4-10 2 3h6' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="header"></header>
<main>
<div class="page-head">
  <h1>Dataset kasus lama</h1>
  <p>Diambil dari Tabel 2&ndash;6 artikel. Bobot ditampilkan sesuai artikel (&ldquo;&ndash;&rdquo; berarti kosong di artikel). Bobot tidak dipakai pada rumus kemiripan artikel (Gambar 14).</p>
</div>
<div class="filters" role="group" aria-label="Filter jenis penyakit">
  <button type="button" data-f="" aria-pressed="true">Semua</button>
  <button type="button" data-f="jantung" aria-pressed="false">Jantung</button>
  <button type="button" data-f="lambung" aria-pressed="false">Lambung</button>
</div>
<div class="cases" id="isi"></div>
</main>
<footer id="footer"></footer>
<script src="js/layout.js"></script><script src="js/data.js"></script>
<script>
(function(){
  var box=document.getElementById('isi');
  box.innerHTML=KASUS.map(function(k){
    var c=k.tipe==='Jantung'?'jantung':'lambung';
    return '<article class="card case '+c+'" data-t="'+c+'" aria-labelledby="k-'+k.id+'"><header><span class="chip '+c+'">'+k.tipe+'</span><h2 id="k-'+k.id+'">'+k.nama+'</h2><span class="hint">'+k.gejala.length+' gejala</span></header>'+
      '<div class="tabel" tabindex="0" role="region" aria-label="Gejala '+k.nama+'"><table><thead><tr><th scope="col">Kode</th><th scope="col">Gejala</th><th scope="col">Bobot</th></tr></thead><tbody>'+
      k.gejala.map(function(g){
        return '<tr><td>'+g.kode+'</td><td>'+GEJALA_NAMA[g.kode]+'</td><td>'+(g.bobot===null?'<span class="kosong" aria-label="kosong">&ndash;</span>':g.bobot)+'</td></tr>';
      }).join('')+'</tbody></table></div></article>';
  }).join('');
  var tombol=document.querySelectorAll('.filters button');
  Array.prototype.forEach.call(tombol,function(b){
    b.addEventListener('click',function(){
      Array.prototype.forEach.call(tombol,function(x){x.setAttribute('aria-pressed',x===b)});
      Array.prototype.forEach.call(box.children,function(c){c.hidden=!!b.dataset.f&&c.dataset.t!==b.dataset.f});
    });
  });
})();
</script>
</body>
</html>
